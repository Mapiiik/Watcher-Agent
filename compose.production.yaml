services:
  watcher-agent:
    image: ghcr.io/mapiiik/watcher-agent:1
    restart: unless-stopped
    stop_grace_period: 60s

    env_file:
      - .env

    volumes:
      - agent_certs:/app/certs/

    ports:
      - "80:80"
      - "443:443"

    # The agent runs as a user of its own without any capability: the container lets it bind 80 and 443 and ping
    # over an unprivileged ICMP socket. A raw socket (AGENT_ICMP=raw) would need user: root and cap_add: NET_RAW.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
      net.ipv4.ping_group_range: "0 2147483647"

    # allow host access (e.g. to connect to local NMS)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 600
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_LABEL_ENABLE: "true"

volumes:
  agent_certs:
