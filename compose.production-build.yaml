services:
  watcher-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
    restart: unless-stopped
    stop_grace_period: 60s

    env_file:
      - .env

    volumes:
      - agent_certs:/app/certs/

    ports:
      - "80:80"
      - "443:443"

    # NET_RAW only for a raw ICMP socket (AGENT_ICMP), NET_BIND_SERVICE for the ports 80 and 443
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE

    # allow host access (e.g. to connect to local NMS)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  agent_certs:
