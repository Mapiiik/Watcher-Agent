name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The minor release only: every build takes its latest patch release (security fixes)
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: 'v2.15.0'
jobs:
  ##########################################################################
  # Scheduled runs build only when the commit, the Go patch release or the
  # runtime image changed, pushes and manual runs always build.
  ##########################################################################
  setup:
    name: Resolve base images
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      skip_build: ${{ steps.image_check.outputs.skip_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # docker/metadata-action lowercases the image name on its own, but the
      # existence check below addresses the registry directly.
      - name: Normalize image name
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      # The commit and the digests of every FROM image: a new base image (security
      # fixes) is a reason to rebuild, an unchanged one is not.
      - name: Build key from commit and base images
        id: key
        run: |
          BASES="$(awk 'toupper($1) == "FROM" { img = $NF; for (i = 2; i <= NF; i++) if (toupper($i) == "AS") img = $(i - 1); print img }' \
            docker/Dockerfile.production | sed "s/\${GO_VERSION}/$GO_VERSION/" | sort -u)"
          DIGESTS=""
          for base in $BASES; do
            digest="$(docker buildx imagetools inspect --raw "$base" | sha256sum | cut -c1-64)"
            echo "::notice::$base $digest"
            DIGESTS="$DIGESTS $digest"
          done
          BASE_KEY="$(echo "$DIGESTS" | sha256sum | cut -c1-12)"
          echo "key=build-${GITHUB_SHA::7}-${BASE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists (for scheduler)
        id: image_check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            IMAGE="${{ steps.image.outputs.name }}:${{ steps.key.outputs.key }}"

            echo "::notice::Checking if image exists: $IMAGE"

            if docker manifest inspect "$IMAGE" > /dev/null; then
              echo "::notice::Image already exists, skipping scheduled build."
              echo "skip_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Image not found or registry error – proceeding with build."
            fi
          else
            echo "::notice::Triggered by ${{ github.event_name }} – forcing rebuild."
          fi

  test:
    name: Lint & Test
    needs: setup
    if: needs.setup.outputs.skip_build != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Go vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Go test
        run: go test ./...

  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs:
      - setup
      - test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ needs.setup.outputs.key }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.production
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
